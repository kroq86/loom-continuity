[project]
name = "loom-continuity"
version = "0.1.0"
description = "Runtime for durable derived knowledge: versioned results with evidence, staleness, safe recomputation across processes, and crash-safe notification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
